<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BubbleTree</title>
  <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
  <link href="[https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap](https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap)" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Escudo Anti Pantalla Blanca -->
  <script>
    window.onerror = function(msg, url, line) {
      document.body.innerHTML = '<div style="padding:40px; text-align:center; font-family:sans-serif;">' +
        '<h2 style="color:#E52D27;">¡Error detectado!</h2>' +
        '<p style="color:#15131F; background:#f4f3f8; padding:15px; border-radius:8px; display:inline-block;">' + msg + ' (Línea: ' + line + ')</p>' +
        '<p style="font-size:13px; color:#5E5A70; margin-top:20px;">Revisa que no hayas pegado las comillas ```javascript dentro de tu archivo app.js.</p></div>';
    };
  </script>

  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
